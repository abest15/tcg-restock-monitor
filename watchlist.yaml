# What the bot hunts for. Edit freely; restart the bot to apply changes.
#
# Each product entry:
#   match:   words that must ALL appear in the retailer's title ("a|b" = either a or b)
#   exclude: if any of these appear, it's not this product
#   msrp:    expected retail price. Listings above msrp x 1.15 are treated as scalpers and ignored
#   priority: max (urgent alarm) | high | normal | low
#   tcgplayer_id: the number in the product's tcgplayer.com URL. Adds resale value to alerts and reports.
#   name: leave out to use the retailer's own title (good for whole-set catch-alls)
#
# First match wins, so put specific entries (Pokémon Center ETB) above general ones (any ETB).
# Anything Pokémon/One Piece TCG that matches NO entry is still caught by the generic
# rules (see generic_alerts) at normal priority, so brand-new products aren't missed.
# Release info current as of Oct 16 2026. Confirm dates on pokemon.com / en.onepiece-cardgame.com.

search_terms:
  # {term, pages}: broad searches read several pages of results; set names read one page.
  # Add each new set's name here when it's announced (that's how the bot finds its products).
  pokemon:
    - {term: pokemon trading card game, pages: 4}
    - {term: pokemon cards, pages: 3}
    - {term: pokemon elite trainer box, pages: 2}
    - {term: pokemon booster bundle, pages: 2}
    - pokemon booster box
    - pokemon tcg tin
    - pokemon tcg blister
    - pokemon premium collection
    - pokemon ultra premium collection
    - pokemon build and battle
    - pokemon mega evolution
    - pokemon delta reign
    - pokemon 30th celebration
    - pokemon pitch black
    - pokemon chaos rising
    - pokemon perfect order
    - pokemon ascended heroes
    - pokemon phantasmal flames
    - pokemon prismatic evolutions
    - pokemon deck crafter
    - pokemon center elite trainer box
    - pokemon mini tin
    - pokemon booster pack
  onepiece:
    - {term: one piece card game, pages: 3}
    - one piece booster box
    - one piece tcg
    - one piece starter deck
    - one piece double pack
    - one piece premium card collection
    - one piece dominance of god
    - one piece heroines edition
    - one piece extra booster
    - one piece premium booster

# Online card shops on Shopify (the bot reads their full product list). Restocks and new products
# alert like any retailer, and only when the price beats TCGplayer.
shops:
  - {name: "Foil Pack Fanatic", domain: "foilpackfanatic.com", pages: 8}

generic_alerts:
  enabled: true          # alert on any Pokémon/One Piece TCG product, not just the entries below
  priority: normal

ignore:                  # titles containing any of these are never alerted
  - code card
  - lot of
  - repack
  - mystery
  - graded
  - psa 10
  - bulk

products:
  # ---------------- Pokémon: Mega Evolution - Delta Reign (Nov 6, 2026) ----------------
